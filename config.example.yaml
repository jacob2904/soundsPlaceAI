# ---------------------------------------------------------------------------
# soundsPlaceAI / CineSFX non-secret configuration.
# Copy to `config.yaml`. Secrets live in `.env`, never here.
# ---------------------------------------------------------------------------

# Which LLM understands the scenes. One of: gemini | openai | claude
brain: gemini

brains:
  gemini:
    model: gemini-2.5-flash          # fast + vision-capable; use -pro for max quality
    temperature: 0.4
    max_output_tokens: 4096
  openai:
    model: gpt-4o                     # any vision-capable model
    temperature: 0.4
    max_output_tokens: 4096
  claude:
    model: claude-3-5-sonnet-latest   # vision-capable
    temperature: 0.4
    max_output_tokens: 4096

# Which platform the effects come from.
# One of: epidemic | artlist | audiio | musicbed | soundly | freesound | local
sound_provider: epidemic

sound_providers:
  epidemic:
    quality: high                     # normal (128k) | high (320k)
  freesound:
    page_size: 15
  soundly:
    # Point this at your local Soundly library / downloads folder.
    library_path: ~/Soundly/Library
  local:
    library_path: ~/SFX
  artlist:
    # base URL + token come from .env (ARTLIST_API_BASE / ARTLIST_API_TOKEN)
    page_size: 15
  audiio:
    page_size: 15
  musicbed:
    page_size: 15

# Scene analysis (efficiency knobs).
analysis:
  detector: content                   # content | adaptive
  threshold: 27.0                     # PySceneDetect sensitivity
  downscale_factor: 2                 # >1 = analyse smaller frames = faster
  frames_per_scene: 2                 # key-frames sent to the brain per shot
  keyframe_width: 512                 # px; downscaled frames keep uploads tiny
  min_scene_seconds: 0.4              # ignore ultra-short flashes

# How sounds are placed on the timeline.
placement:
  sfx_track_name: "CineSFX"           # dedicated audio track(s) created for SFX
  max_lanes: 3                        # extra SFX tracks used to avoid overlaps
  default_fade_ms: 40
  max_cues_per_scene: 4               # keep scenes from getting cluttered
  headroom_db: -3.0                   # master ceiling for placed SFX
  ambience_gain_db: -18.0             # beds sit lower than spot effects

# Realistic (Soundly-style) spatialisation.
spatial:
  enabled: true
  max_distance_attenuation_db: -12.0  # gain drop for the farthest sounds
  max_pan: 0.8                        # clamp so nothing hard-pans unnaturally

# Runtime behaviour.
runtime:
  max_workers: 4                      # clips analysed in parallel
  cache_dir: ~/.cache/cinesfx
  log_level: INFO
