[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinesfx"
version = "0.1.0"
description = "AI-driven cinematic sound-effects placement for DaVinci Resolve 21 Studio"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "soundsPlaceAI contributors" }]
dependencies = [
    "scenedetect>=0.6.4",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.7.0", "Pillow>=10.0.0"]
openai = ["openai>=1.30.0"]
claude = ["anthropic>=0.30.0"]
# Read audio durations while cataloging your own sound library (optional).
library = ["tinytag>=1.10.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
cinesfx = "scripts.run_cli:main"
cinesfx-install = "cinesfx.installer:main"

[tool.setuptools.packages.find]
include = ["cinesfx*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
